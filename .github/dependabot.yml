# Updates for the packages and the workflows' actions (#80), once a week:
# minor and patch only (Orel, 12 November 2026). Those of the packages come
# together in one pull request. A major version is moved by hand, in a pull
# request of its own, when there is a reason to. Each pull request runs CI
# like any other and is merged by hand. Alerts and security updates as soon as
# there is one are switched on in the repository's settings (Code security),
# not here; a security update still comes for a major version.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "06:00"
      timezone: Asia/Jerusalem
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # The actions are pinned to a commit with its version beside it
  # (.github/workflows): Dependabot moves both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "06:00"
      timezone: Asia/Jerusalem
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
