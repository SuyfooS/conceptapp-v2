# Applies migrations to conceptapp-dev. Only by hand: Orel presses Run workflow,
# and with "apply" off it shows what would run and changes nothing. See issue #8.
name: Migrate conceptapp-dev

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the migrations. Off shows what would run and changes nothing.
        type: boolean
        default: false

concurrency:
  group: migrate-dev
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # GitHub's runners have no IPv6, and the project's direct address is IPv6
      # only, so connect through the session pooler. Its address comes from the
      # Management API, and the whole URL is masked in the logs.
      - name: Find the connection
        run: |
          DB_URL=$(curl -sSf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler" \
            | node -e '
              const pools = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
              const pool = pools.find((p) => p.database_type === "PRIMARY") ?? pools[0];
              const password = encodeURIComponent(process.env.SUPABASE_DB_PASSWORD);
              console.log(`postgresql://${pool.db_user}:${password}@${pool.db_host}:5432/${pool.db_name}`);
            ')
          echo "::add-mask::$DB_URL"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: What the project has now
        run: pnpm exec supabase migration list --db-url "$DB_URL"

      - name: What would run
        run: pnpm exec supabase db push --db-url "$DB_URL" --dry-run

      - name: Apply
        if: inputs.apply
        run: pnpm exec supabase db push --db-url "$DB_URL"

      - name: What the project has after
        if: inputs.apply
        run: pnpm exec supabase migration list --db-url "$DB_URL"
