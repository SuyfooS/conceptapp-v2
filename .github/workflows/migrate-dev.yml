# Applies migrations to conceptapp-dev. Only by hand: Orel presses Run workflow,
# and with "apply" off it shows what would run and changes nothing. Applying only
# ever runs from main. See issue #8.
name: Migrate conceptapp-dev

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the migrations. Off shows what would run and changes nothing.
        type: boolean
        default: false
      demo:
        description: Add the demo businesses that are not there yet (supabase/hosted-demo.sql). Safe to run again.
        type: boolean
        default: false

concurrency:
  group: migrate-dev
  cancel-in-progress: false

# Read the code and nothing more (#80). Every action is pinned to a commit,
# with its version beside it for Dependabot.
permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The database's secrets reach only the step that connects (#80), never
    # the install before it: from there on the steps read DB_URL, masked. The
    # CLI is given the address, so it needs no access token.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # GitHub's runners have no IPv6, and the project's direct address is IPv6
      # only, so connect through the session pooler. Its shard is not fixed per
      # region, so try each. Everything secret is masked in the logs.
      - name: Find the connection
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_REGION: eu-central-1
        run: |
          PASSWORD=$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')
          echo "::add-mask::$PASSWORD"
          for SHARD in aws-1 aws-0; do
            URL="postgresql://postgres.$SUPABASE_PROJECT_REF:$PASSWORD@$SHARD-$SUPABASE_REGION.pooler.supabase.com:5432/postgres"
            echo "::add-mask::$URL"
            if pnpm exec supabase migration list --db-url "$URL"; then
              echo "DB_URL=$URL" >> "$GITHUB_ENV"
              echo "Connected through $SHARD"
              exit 0
            fi
          done
          echo "::error::No session pooler address worked"
          exit 1

      - name: What the project has now
        run: pnpm exec supabase migration list --db-url "$DB_URL"

      - name: What would run
        run: pnpm exec supabase db push --db-url "$DB_URL" --dry-run

      - name: Apply
        if: inputs.apply && github.ref == 'refs/heads/main'
        run: pnpm exec supabase db push --db-url "$DB_URL"

      - name: What the project has after
        if: inputs.apply && github.ref == 'refs/heads/main'
        run: pnpm exec supabase migration list --db-url "$DB_URL"

      - name: The demo businesses
        if: inputs.demo && github.ref == 'refs/heads/main'
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/hosted-demo.sql
