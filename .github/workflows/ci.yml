name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A full run on main whenever wanted: the gate acts on pushes only.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read the code and nothing more (#80); a job that needs more says so. Every
# action is pinned to a commit, with its version beside it for Dependabot.
permissions:
  contents: read

jobs:
  # Push to main only. A squash merge of an up-to-date branch lands exactly the
  # tree its pull request run tested. If that tree passed check, database and
  # e2e in one pull_request run created today (Asia/Jerusalem), link that run
  # and skip the three here. Anything else, an error included: everything runs.
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.find.outputs.tested }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts
      - id: find
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          if ! url=$(bash .github/scripts/tested-tree.sh "$GITHUB_SHA" 2> reasons.txt); then
            { echo "The tree check failed, so everything runs:"; cat reasons.txt; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat reasons.txt >> "$GITHUB_STEP_SUMMARY"
          if [[ "$url" == https://* ]]; then
            echo "tested=yes" >> "$GITHUB_OUTPUT"
            echo "This exact tree passed check, database and e2e today in $url, so they do not run again here. For a full run on main anyway: Actions, CI, Run workflow." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No pull_request run passed every job on this tree today: everything runs." >> "$GITHUB_STEP_SUMMARY"
          fi

  check:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.tested != 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # the gate's dry run below
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The gate's script on every pull request, against the tip of main it is
      # based on. It only prints; the push to main is where it decides.
      - name: Tree gate, dry run on main's tip
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_ID: ${{ github.repository_id }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          url=$(bash .github/scripts/tested-tree.sh "$BASE_SHA")
          echo "Main at $BASE_SHA: ${url:-no passing pull_request run today, so a push of it would run everything}" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format (Biome)
        run: pnpm exec biome ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Evidence for the push to main (read by .github/scripts/tested-tree.sh):
      # this job passed on exactly this tree, the test merge commit checked out above.
      - name: Record the tree this job passed on
        id: passed
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_SHA $tree" > "$RUNNER_TEMP/passed.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'pull_request' && steps.passed.outputs.tree != ''
        continue-on-error: true
        with:
          name: passed-${{ github.job }}-${{ steps.passed.outputs.tree }}
          path: ${{ runner.temp }}/passed.txt
          retention-days: 1
          if-no-files-found: error

  database:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.tested != 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start local Postgres, apply migrations and seed
        run: pnpm exec supabase db start

      - name: RLS and isolation tests (pgTAP)
        run: pnpm db:test

      - name: Templates against the manifests
        run: pnpm test:db

      - name: Database lint
        run: pnpm exec supabase db lint --level warning --fail-on warning

      - name: Generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code packages/db/database.types.ts

      - name: Record the tree this job passed on
        id: passed
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_SHA $tree" > "$RUNNER_TEMP/passed.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'pull_request' && steps.passed.outputs.tree != ''
        continue-on-error: true
        with:
          name: passed-${{ github.job }}-${{ steps.passed.outputs.tree }}
          path: ${{ runner.temp }}/passed.txt
          retention-days: 1
          if-no-files-found: error

  # After check and database pass: a red PR doesn't spend the time on e2e.
  # One job per screen size, side by side, each with its own database: the
  # sizes no longer share the demo data, and the run takes a third of the
  # time it took in one job (it had reached the 45-minute limit).
  e2e:
    name: e2e (${{ matrix.project }})
    needs: [gate, check, database]
    if: >-
      ${{ !cancelled() && needs.gate.outputs.tested != 'yes'
        && needs.check.result == 'success' && needs.database.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [phone, tablet, desktop]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The stack starts in the background while Chromium installs; `wait`
      # fails the step if it did not start, and the log is printed either way.
      # Storage runs for the profile photos (e2e/profile.spec.ts); its image
      # transformations (imgproxy) are not used.
      # Chromium's system packages come from Ubuntu's archives. The runner
      # already has all but a few fonts, so when the archives can't be
      # reached (11 November 2026, a DNS outage on the runners) Chromium is
      # installed alone, on what the runner has, with a warning. Chromium
      # itself must install: that failing still fails the step.
      - name: Start local Supabase (database, auth, API, storage) and install Chromium
        run: |
          log="$RUNNER_TEMP/supabase-start.log"
          pnpm exec supabase start \
            -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            > "$log" 2>&1 &
          supabase=$!
          trap 'echo "::group::supabase start"; cat "$log"; echo "::endgroup::"' EXIT
          if ! pnpm exec playwright install --with-deps chromium; then
            echo "::warning::Chromium's system packages could not be installed from Ubuntu's archives; installing Chromium on the runner's own packages"
            pnpm exec playwright install chromium
          fi
          echo "Chromium ready at $(date -u +%T)"
          wait "$supabase"
          echo "Supabase ready at $(date -u +%T)"

      # The local stack's URL and keys are fixed development values, not
      # real secrets; read them from the CLI rather than hard-coding. The
      # secret key (server-only writes) is masked in the log all the same.
      # Notifications on the phone get a VAPID pair and a cron secret made
      # fresh for this run (tooling/vapid-keys.mjs), never committed and never
      # production's, and the loopback mock push service of e2e/push.spec.ts.
      # The check job's build has none of them: the app in-app only.
      - name: Point the app at local Supabase
        run: |
          eval "$(pnpm exec supabase status -o env)"
          echo "::add-mask::$SECRET_KEY"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
          vapid=$(node tooling/vapid-keys.mjs --env)
          echo "::add-mask::$(printf '%s\n' "$vapid" | sed -n 's/^VAPID_PRIVATE_KEY=//p')"
          printf '%s\n' "$vapid" >> "$GITHUB_ENV"
          echo "VAPID_SUBJECT=mailto:dev@conceptapp.invalid" >> "$GITHUB_ENV"
          cron_secret=$(openssl rand -hex 32)
          echo "::add-mask::$cron_secret"
          echo "CRON_SECRET=$cron_secret" >> "$GITHUB_ENV"
          echo "PUSH_TEST_ORIGIN=http://127.0.0.1:3199" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Playwright (${{ matrix.project }})
        run: pnpm e2e --project=${{ matrix.project }}

      # The results are for reading a failure, not part of passing: when
      # GitHub's artifact service is down (11 November 2026, it answered with
      # a web page), the job keeps the tests' own outcome and still records
      # the tree it passed on.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        continue-on-error: true
        with:
          name: playwright-results-${{ matrix.project }}
          path: test-results/
          # 3 days, not 7: at ~14 MB a run, 7 days kept ~1.3 GB against the
          # plan's 1 GB, and a refused upload would also stop the record below.
          retention-days: 3

      - name: Record the tree this job passed on
        id: passed
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_SHA $tree" > "$RUNNER_TEMP/passed.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'pull_request' && steps.passed.outputs.tree != ''
        continue-on-error: true
        with:
          name: passed-${{ github.job }}-${{ matrix.project }}-${{ steps.passed.outputs.tree }}
          path: ${{ runner.temp }}/passed.txt
          retention-days: 1
          if-no-files-found: error
