# Applies migrations to conceptapp-prod, the project of real businesses
# (docs/production.md, B3). By hand only, from main only, and only once Orel
# approves the run: the job runs in the GitHub environment conceptapp-prod,
# which takes main alone, waits for its required reviewer and holds the
# database's two secrets, PROD_SUPABASE_DB_PASSWORD and
# PROD_SUPABASE_PROJECT_REF (Orel sets all three in GitHub). With "apply"
# off it shows what would run and changes nothing; with it on, the run's
# summary ends with the commit to release to the site of real businesses.
# Nothing here adds demo data or runs a SQL file: the demo stays in
# conceptapp-dev (tooling/migrate-prod.test.ts keeps it so).
name: Migrate conceptapp-prod

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the migrations. Off shows what would run and changes nothing.
        type: boolean
        default: false

concurrency:
  group: migrate-prod
  cancel-in-progress: false

# Read the code and nothing more (#80). Every action is pinned to a commit,
# with its version beside it for Dependabot.
permissions:
  contents: read

jobs:
  migrate:
    # Started from another branch, the job doesn't run, so it never asks for
    # the environment, whose own rule (main only) holds as well.
    if: github.ref == 'refs/heads/main'
    environment: conceptapp-prod
    runs-on: ubuntu-latest
    # The first apply runs every migration there is.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The two secrets reach this step alone (#80); from here on the steps
      # read DB_URL, masked. Their names are their own, never those of
      # migrate-dev.yml's secrets (repository secrets until docs/production.md's
      # A1, then only in the environment conceptapp-dev): GitHub hands a job the
      # repository secret of the same name when its environment has none, and
      # makes the environment, with no rules, the first time a job asks for
      # it. So a secret missing here is empty, the check below stops the run
      # before any connection, and entering these never overwrites the
      # development project's. Through the session pooler, trying each shard,
      # as migrate-dev.yml does: the runners have no IPv6. The CLI is given
      # the address, so it needs no access token.
      - name: Find the connection
        env:
          PROD_SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
          PROD_SUPABASE_PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
          SUPABASE_REGION: eu-central-1
        run: |
          if [ -z "$PROD_SUPABASE_DB_PASSWORD" ] || [ -z "$PROD_SUPABASE_PROJECT_REF" ]; then
            echo "::error::The conceptapp-prod environment has no PROD_SUPABASE_DB_PASSWORD or PROD_SUPABASE_PROJECT_REF (docs/production.md, B3)"
            exit 1
          fi
          PASSWORD=$(node -p 'encodeURIComponent(process.env.PROD_SUPABASE_DB_PASSWORD)')
          echo "::add-mask::$PASSWORD"
          for SHARD in aws-1 aws-0; do
            URL="postgresql://postgres.$PROD_SUPABASE_PROJECT_REF:$PASSWORD@$SHARD-$SUPABASE_REGION.pooler.supabase.com:5432/postgres"
            echo "::add-mask::$URL"
            if pnpm exec supabase migration list --db-url "$URL"; then
              echo "DB_URL=$URL" >> "$GITHUB_ENV"
              echo "Connected through $SHARD"
              exit 0
            fi
          done
          echo "::error::No session pooler address worked"
          exit 1

      # Before anything is applied: the project these secrets reach holds no
      # demo business. One that does is the development project, its secrets
      # put here by mistake. A new project has no such table yet, and a query
      # naming a missing table fails before it runs, so two queries.
      - name: Not the demo's project
        run: |
          table=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select to_regclass('private.demo_businesses') is not null")
          if [ "$table" = "t" ]; then
            demos=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select count(*) from private.demo_businesses")
            if [ "$demos" != "0" ]; then
              echo "::error::This project holds demo businesses: these are not conceptapp-prod's secrets. Nothing was applied."
              exit 1
            fi
          fi
          echo "No demo business here"

      - name: What the project has now
        run: pnpm exec supabase migration list --db-url "$DB_URL"

      # `db push` applies migrations alone: it adds seed data only when told
      # to, and nothing here tells it.
      - name: What would run
        run: pnpm exec supabase db push --db-url "$DB_URL" --dry-run

      - name: Apply
        if: inputs.apply && github.ref == 'refs/heads/main'
        run: pnpm exec supabase db push --db-url "$DB_URL"

      - name: What the project has after
        if: inputs.apply && github.ref == 'refs/heads/main'
        run: pnpm exec supabase migration list --db-url "$DB_URL"

      # Once applied: the commit these migrations came from, and the two lines
      # that release it to the site of real businesses, which deploys the
      # branch production and nothing else (docs/production.md, B7 and the
      # update after a real business is live). Orel runs them on his own
      # computer; a push that isn't a fast-forward is refused, so they never
      # move the site back. This step writes the run's summary and nothing
      # more.
      - name: The commit to release
        if: inputs.apply && github.ref == 'refs/heads/main'
        run: |
          {
            echo "### Applied from $GITHUB_SHA"
            echo ""
            echo "To release it to the site of real businesses: in PowerShell, in the project's folder, one line at a time."
            echo ""
            echo '```powershell'
            echo "git fetch origin"
            echo "git push origin $GITHUB_SHA:refs/heads/production"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
